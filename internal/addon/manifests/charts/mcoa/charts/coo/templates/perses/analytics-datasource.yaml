{{- $hasAnalytics := dict }}
{{- range .Values.dashboards }}
{{- if eq .namespace "observability-analytics" }}
{{- $_ := set $hasAnalytics "found" true }}
{{- end }}
{{- end }}
{{- if hasKey $hasAnalytics "found" }}
apiVersion: perses.dev/v1alpha1
kind: PersesDatasource
metadata:
  name: rbac-query-proxy-datasource
  namespace: observability-analytics
spec:
  client:
    tls:
      caCert:
        certPath: /ca/service-ca.crt
        type: file
      enable: true
  config:
    default: true
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: 'http://rbac-query-proxy.open-cluster-management-observability.svc.cluster.local:8080'
{{- end }}
